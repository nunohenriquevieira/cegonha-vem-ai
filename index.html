function fit(){
  const vw=innerWidth,vh=innerHeight,pe=MOBILE&&vh>vw,d=window.devicePixelRatio||1;

    const g=window.__G;                      // de pé: o jogo pára e fica em silêncio até o telemóvel ser rodado

      else if(!g.paused)SND.pause(false);
    }
  }
  const aw=rodado?vh:vw,ah=rodado?vw:vh;
  const s=Math.min(aw/W,ah/H),sd=s*d,kd=Math.floor(sd);
  const k=(kd>=2&&(sd-kd)/sd<0.15)?kd/d:s;   // escala inteira (píxeis nítidos) se não custar mais de 15% do tamanho
  cv.style.width=(W*k)+'px';cv.style.height=(H*k)+'px';

}

function piece(p,pts){
  if(p<=pts[0][0])return pts[0][1];
  for(let i=1;i<pts.length;i++)if(p<=pts[i][0]){const a=pts[i-1],b=pts[i];return lerp(a[1],b[1],(p-a[0])/(b[0]-a[0]));}
  return pts[pts.length-1][1];

const ACCR={a:[[4,-3,2,1],[3,-2,2,1]],g:[[1,-3,2,1],[2,-2,2,1]],t:[[2,-3,2,1],[6,-3,1,1],[1,-2,1,1],[4,-2,2,1]],c:[[3,-3,1,1],[2,-2,1,1],[4,-2,1,1]]};
const TOPOFF={};
/* A fonte é monoespaçada (1 letra = size px). Os acentos das maiúsculas são desenhados à mão, por cima da letra. */
function txt(s,x,y,size,color,align,shadow){
  ctx.font=size+'px "PS2P"';ctx.textBaseline='top';ctx.textAlign='left';
  let base='';const marks=[];
  for(let i=0;i<s.length;i++){const a=ACC[s[i]];if(a){base+=a[0];marks.push([i,a[1]]);}else base+=s[i];}
  const w=s.length*size,u=size/8;
  x=Math.round(align==='center'?x-w/2:align==='right'?x-w:x);y=Math.round(y);
  if(TOPOFF[size]===undefined){const m=ctx.measureText('E');TOPOFF[size]=Math.round(-m.actualBoundingBoxAscent);}
  const top=y+TOPOFF[size];
  const pass=(dx,dy,col)=>{
    ctx.fillStyle=col;ctx.fillText(base,x+dx,y+dy);
    for(const mk of marks)for(const r of ACCR[mk[1]])ctx.fillRect(x+dx+mk[0]*size+r[0]*u,top+dy+r[1]*u,r[2]*u,r[3]*u);
  };
  if(shadow){const o=Math.max(1,size>>3);pass(o,o,shadow);}
  pass(0,0,color);
}

  const pronto=()=>ac&&!muted&&ac.state==='running';   // sons pedidos com o áudio ainda a dormir não ficam em fila (sairiam todos juntos e atrasados)
  function tone(f,t0,dur,type,vol,slide){
    if(!pronto())return;
    try{
      const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';
      o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
      g.gain.setValueAtTime(vol||0.06,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.03);
    }catch(e){}
  }
  function noise(t0,dur,vol){
    if(!pronto())return;
    try{
      const n=Math.max(1,Math.floor(ac.sampleRate*dur)),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
      const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=vol||0.06;s.connect(g);g.connect(master);s.start(t0);
    }catch(e){}
  }
  const now=()=>ac?ac.currentTime:0;
  const SONGS={
    voo:{bpm:132,lead:[
      76,79,84,79,76,79,84,0, 74,79,83,79,74,79,83,0, 72,76,81,76,72,76,81,79, 77,81,84,81,79,77,76,74,
      76,0,79,0,84,83,81,79, 74,0,79,0,83,81,79,77, 81,77,84,81,83,79,86,83, 84,0,79,0,84,0,0,0],
      bass:[48,55,48,55, 43,50,43,50, 45,52,45,52, 41,48,41,48, 48,55,48,55, 43,50,43,50, 41,48,43,50, 48,55,48,48],
      lv:0.035,bv:0.06,type:'square'},
    festa:{bpm:104,lead:[
      72,76,79,84,79,76, 77,81,84,89,84,81, 79,83,86,91,86,83, 84,0,79,0,84,0,
      76,79,84,88,84,79, 77,81,84,89,84,81, 74,79,83,86,83,79, 84,0,88,0,84,0],
      bass:[48,0,55, 41,0,48, 43,0,50, 48,0,55, 48,0,55, 41,0,48, 43,0,50, 48,0,48],
      lv:0.05,bv:0.06,type:'triangle'}
  };
  function tick(){
    if(!ac||!song||ac.state!=='running')return;
    const s=SONGS[song],d=60/s.bpm/2;
    if(nextT<ac.currentTime)nextT=ac.currentTime+0.05;   // nunca tocar notas "em atraso" de uma só vez
    while(nextT<ac.currentTime+0.25){
      const l=s.lead[step%s.lead.length];if(l)tone(mf(l),nextT,d*0.9,s.type,s.lv);
      if(step%2===0){const b=s.bass[(step/2)%s.bass.length];if(b)tone(mf(b),nextT,d*1.7,'triangle',s.bv);}
      nextT+=d;step++;
    }
  }
  function music(name){
    song=name;step=0;if(ac)nextT=ac.currentTime+0.08;
    if(timer){clearInterval(timer);timer=null;}
    if(name)timer=setInterval(tick,60);
  }
  return {
    init,music,estado(){return ac?ac.state+' '+(ac.baseLatency||0).toFixed(3)+' '+(ac.outputLatency||0).toFixed(3):'sem som';},
    toggle(){muted=!muted;return muted;},
    pause(p){parado=!!p;if(!ac)return;try{if(p)ac.suspend();else ac.resume();}catch(e){}},
    flap(){const t=now();noise(t,0.06,0.022);tone(300,t,0.07,'triangle',0.028,180);},
    pick(i){const t=now(),b=[880,988,1047,1175,1319][i%5];tone(b,t,0.07,'square',0.05);tone(b*1.5,t+0.06,0.1,'square',0.05);},
    hit(){const t=now();noise(t,0.25,0.12);tone(320,t,0.3,'sawtooth',0.08,70);},
    star(){const t=now();[72,76,79,84,88].forEach((m,i)=>tone(mf(m),t+i*0.06,0.14,'square',0.06));},
    pop(){const t=now();noise(t,0.1,0.08);tone(500,t,0.1,'square',0.05,900);},
    bounce(){const t=now();tone(160,t,0.08,'triangle',0.05,240);},
    buzz(){const t=now();tone(196,t,0.16,'square',0.08);tone(147,t+0.2,0.34,'square',0.08);},
    fanfare(){const t=now();[60,64,67,72].forEach((m,i)=>tone(mf(m),t+i*0.12,0.2,'square',0.07));[72,76,79].forEach(m=>tone(mf(m),t+0.5,0.7,'square',0.05));},
    drum(v){const t=now();noise(t,0.05,v||0.07);tone(150,t,0.1,'triangle',(v||0.07)*1.4,70);},
    reveal(){const t=now();noise(t,0.5,0.12);[60,64,67,72,76,79,84].forEach((m,i)=>tone(mf(m),t+i*0.07,0.3,'square',0.07));[72,76,79,84].forEach(m=>tone(mf(m),t+0.55,1.2,'triangle',0.07));},
    letter(i){tone(mf(72+[0,4,7,12,16,19,24][i%7]),now(),0.18,'square',0.06);},
    type(){tone(1400,now(),0.03,'square',0.03);}
  };
})();

/* ---------- colisões ---------- */
const PBOX=[20,22,48,40];           // tronco + cabeça da cegonha (a trouxa não conta: é mais simpático)
const PCOL=[2,15,62,56];            // caixa para apanhar prémios
function obox(o){const b=META[o.k].box,w=b[2]-b[0],h=b[3]-b[1],ix=w*0.2,iy=h*0.2;return [o.x+b[0]+ix,o.y+b[1]+iy,o.x+b[2]-ix,o.y+b[3]-iy];}
const hitR=(a,b)=>a[0]<b[2]&&a[2]>b[0]&&a[1]<b[3]&&a[3]>b[1];

/* ---------- geração de obstáculos e prémios ---------- */
function phaseOf(p){return p<30?0:p<62?1:2;}
function laneY(){
  let y,i=0;
  if(V&&Math.random()<0.3){y=clamp(G.py+rnd(-40,40),HUD_H-6,GROUND-70);G.lastY=y;return y;}   // de pé há o dobro da altura: algumas nuvens vêm à altura da cegonha
  do{y=rnd(HUD_H-6,GROUND-64-6);i++;}while(Math.abs(y-G.lastY)<48&&i<8);
  G.lastY=y;return y;
}
function nextLabel(){
  const ponte=G.gx>200&&G.gx<1000;
  if(ponte&&G.ponteN<3&&Math.random()<0.75){G.ponteN++;return NUVEM_PONTE;}
  if(!G.deck.length){G.deck=NUVENS.slice();for(let i=G.deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[G.deck[i],G.deck[j]]=[G.deck[j],G.deck[i]];}}
  return G.deck.pop();
}
function addObs(k,y,extra){
  const o=Object.assign({k,x:W+8,y,by:y,t:rnd(0,6),vx:0,amp:0,fr:0},extra||{});
  o.lab=o.semLab?null:k==='crow'?[CORVO]:nextLabel();o.tc=k==='crow'?'#fff6e0':pick(TAGC);
  G.obs.push(o);return o;
}
function spawnObstacle(){
  const ph=G.phase;
  if(false){   // duplas desligadas: o número de nuvens mantém-se constante
    const top=rnd(HUD_H-14,Math.max(HUD_H+10,GROUND-250));
    addObs(pick(['storm','rain']),top).tagOn=true;   // na dupla, a etiqueta de cima fica sobre a nuvem para não tapar a passagem
    addObs(pick(['angry','rain']),top+64+rnd(84,96),{semLab:true});   // na dupla só uma nuvem leva mensagem
    G.lastY=top+70;return true;
  }
  const pool=ph===0?['rain','rain','angry','storm']:ph===1?['rain','angry','storm','crow','crow']:['storm','storm','angry','crow','crow','rain'];
  let k=pick(pool);
  if(k==='crow'&&G.picks.some(c=>c.k==='claude'||c.k==='cafe'))k=pick(['rain','storm']);   // os corvos voam mais depressa: com um café ou um Claude no ecrã iam apanhá-lo
  const amp=k==='crow'?8:k==='angry'?24:2;
  let y,i=0;
  do{y=k==='angry'?clamp(laneY(),HUD_H+16,GROUND-64-26):laneY();i++;}while(!semChupetas(k,y,amp)&&i<10);
  if(!semChupetas(k,y,amp))return false;   // não há sítio sem tapar chupetas: tenta outra vez daqui a nada
  if(k==='crow')addObs(k,y,{vx:rnd(45,80),amp:8,fr:3});
  else if(k==='angry')chupetasJunto(addObs(k,y,{amp:24,fr:1.7}));
  else chupetasJunto(addObs(k,y,{amp:2,fr:2}));
  return true;
}
/* Uma fila de chupetas mesmo por cima ou por baixo da nuvem: para as apanhar é preciso passar rente ao obstáculo. */
function chupetasJunto(o){
  if(Math.random()<0.2)return;
  const b=META[o.k].box,h=o.lab?o.lab.length*11+6:0,n=3+Math.floor(Math.random()*2);
  const cima=o.by+b[1]-o.amp-20,baixo=o.by+b[3]+h+o.amp+22;
  const livre=y=>!G.picks.some(c=>c.x>W-45&&Math.abs(c.y-y)<28);
  const ops=[];if(cima>=HUD_H+16&&livre(cima))ops.push(cima);if(baixo<=GROUND-30&&livre(baixo))ops.push(baixo);
  if(!ops.length)return;
  const y=pick(ops);
  for(let i=0;i<n;i++)G.picks.push({k:(G.pc++%2)?'paci_pink':'paci_blue',x:o.x+32-(n-1)*13+i*26,y,t:i*0.5});
}
/* Nuvens e chupetas andam à mesma velocidade: se nascerem sobrepostas, ficam sobrepostas até ao fim. Por isso nunca nascem no mesmo sítio. */
function semChupetas(k,y,amp){   // a nuvem (com a etiqueta por baixo) não pode nascer em cima de chupetas que estão a entrar
  const b=META[k].box,t=y+b[1]-amp-14,f=y+b[3]+28+amp+14;
  return !G.picks.some(c=>c.x>W-45&&c.x<W+125&&c.y>t&&c.y<f);
}
function yLivre(y,r){            // [y-r, y+r] não toca em nenhuma nuvem (nem na etiqueta) que ainda está a entrar
  for(const o of G.obs){
    if(o.x<(o.vx?W-60:W-100))continue;
    const b=META[o.k].box,h=o.lab?o.lab.length*11+6:0;
    if(y+r>o.by+b[1]-o.amp-2&&y-r<o.by+b[3]+h+o.amp+2)return false;
  }
  if(G.picks.some(c=>c.x>W-10&&Math.abs(c.y-y)<r+14))return false;   // nem nas chupetas que vêm coladas a uma nuvem
  return true;
}
function freeY(y0,m){
  m=m||40;for(const o of G.obs){if(o.x>W-140){const cy=o.y+32;if(Math.abs(cy-y0)<m)y0=cy<(HUD_H+GROUND)/2+2?cy+m+22:cy-m-22;}}
  return clamp(y0,HUD_H+22,GROUND-40);
}
function spawnPickups(){
  const n=3+Math.floor(Math.random()*3),amp=rnd(-20,20);let y0,i=0;
  do{y0=rnd(HUD_H+22,GROUND-40);i++;}while(!yLivre(y0,34)&&i<14);
  if(!yLivre(y0,34))return false;
  for(let i=0;i<n;i++){
    G.picks.push({k:(G.pc++%2)?'paci_pink':'paci_blue',x:W+24+i*26,y:clamp(y0+Math.sin(i/(n-1)*Math.PI)*amp,HUD_H+16,GROUND-30),t:i*0.5});
  }
  return true;
}
function burst(x,y,n,colors,sp,grav,life){
  for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(sp*0.3,sp);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:grav||0,life:life||0.6,max:life||0.6,c:pick(colors),s:Math.random()<0.4?3:2});}
}

/* ---------- actualização ---------- */
function updateBg(dt,speed){
  G.scroll=G.gx/GF;
  for(const d of DECO){d.x-=(speed*d.f+3)*dt;if(d.x<-70){d.x=W+rnd(10,90);d.y=rnd(HUD_H-4,GROUND-127);}}
}
function updateParts(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
  for(const f of floats){f.y-=14*dt;f.life-=dt;}
  floats=floats.filter(f=>f.life>0);
}
function updatePlay(dt){
  if(G.paused)return;
  if(G.popup){G.popup.t+=dt;if(G.popup.t>2.5){G.popup=null;G.invuln=Math.max(G.invuln,1.0);}return;}
  G.t+=dt;G.clock=G.t;
  const sh=G.shield>0,vn=100+G.p*0.47;
  // velocidade estável: cresce devagar ao longo da viagem e só muda no turbo do Claude
  const alvo=sh?1.25:1;
  G.mult+=(alvo-G.mult)*Math.min(1,dt*3);
  const dg=vn*G.mult*GF*dt;
  G.gx+=dg;G.speed=vn*G.mult;G.p=100*G.gx/LG;
  const sk=G.speed/vn;               // os temporizadores acompanham a distância, não o relógio
  updateBg(dt,G.speed);
  G.phase=phaseOf(G.p);
  while(G.stage<STAGES.length&&G.gx>=STAGES[G.stage].g){const s=STAGES[G.stage++];G.banner={s:s.banner,t:2.3};}
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  // jogador
  G.vy=Math.min(G.vy+460*dt,205);G.py+=G.vy*dt;
  if(G.py<HUD_H-18){G.py=HUD_H-18;if(G.vy<0)G.vy=0;}
  if(G.py+PCOL[3]>GROUND+2){
    G.py=GROUND+2-PCOL[3];G.vy=-150;SND.bounce();
    const wx=G.gx+G.px+34,agua=WATER.some(r=>wx>r[0]&&wx<r[1]);burst(G.px+34,GROUND,6,agua?['#9eeaff','#fff']:['#b8f07a','#fff'],46,130,0.45);
  }
  G.invuln=Math.max(0,G.invuln-dt);G.shield=Math.max(0,G.shield-dt);
  G.hud=Math.max(0,G.hud-dt);G.stress=Math.max(0,G.stress-0.08*dt);G.noHit+=dt;G.shake=Math.max(0,G.shake-dt);G.flash=Math.max(0,G.flash-dt);
  // spawns
  if(G.p<92){
    G.obsT-=dt*sk;
    if(G.obsT<=0&&G.obs.filter(o=>o.lab&&o.x>-40).length>=2)G.obsT=0.3;   // nunca mais de 2 mensagens no ecrã: dá tempo para as ler
    // cafés, Claudes e nuvens entram sempre separados: nunca dois lado a lado nem um por cima do outro
    const esp=d=>G.picks.some(c=>(c.k==='claude'||c.k==='cafe')&&c.x>W-d);

    if(G.cafes===0&&!G.forced&&!temCafe&&vago&&G.p>48){G.forced=true;G.picks.push({k:'cafe',x:W+24,y:clamp(G.py+32,HUD_H+30,GROUND-30),t:0,force:true});}
  }
  const pb=[G.px+PBOX[0],G.py+PBOX[1],G.px+PBOX[2],G.py+PBOX[3]];
  const pc=[G.px+PCOL[0],G.py+PCOL[1],G.px+PCOL[2],G.py+PCOL[3]];
  // obstáculos
  for(const o of G.obs){
    o.t+=dt;o.x-=(G.speed+o.vx)*VF*dt;

      else if(G.invuln<=0){
        o.spent=true;G.invuln=1.5;const lost=Math.min(2,G.blue);G.blue-=lost;G.pink=G.blue;G.hud=lost?0.6:0;for(let i=0;i<lost*2;i++)parts.push({x:G.px+32,y:G.py+30,vx:rnd(-80,80),vy:rnd(-130,-50),g:260,life:1.2,max:1.2,c:i<lost?'#9fd4ff':'#ffb0d0',s:6});G.vy=-110;G.shake=0.35;G.flash=0.12;G.hits++;G.stress=Math.min(3,G.stress+1);G.noHit=0;G.combo=0;
        SND.hit();burst(G.px+32,G.py+32,12,['#fff','#e9eef7','#c8d0e0'],80,160,0.9);

    const b=[c.x-9,c.y-11,c.x+9,c.y+11];

}
function updateArrive(dt){

  G.px=lerp(G.px,W-254,Math.min(1,dt*2.2));G.py=lerp(G.py,GROUND-112,Math.min(1,dt*2.4));

function updateSuspense(dt){
  G.t+=dt;const s=G.sus;

    s.dt+=dt;s.next-=dt;s.phi=(s.phi||0)+lerp(0.9,2.4,clamp(s.dt/3.4,0,1))*6.283*dt;
    if(s.next<=0){SND.drum(0.05+0.05*s.dt/3.4);s.next=lerp(0.16,0.045,clamp(s.dt/3.4,0,1));}

  }
}
function initConfetti(){
  confetti=[];const cols=['#fff','#ff5fa2','#ffd166','#ffc2dc','#d81b72','#fff3b0'];
  for(let i=0;i<140;i++)confetti.push({x:rnd(0,W),y:rnd(-H,0),vy:rnd(28,70),ph:rnd(0,6.28),sw:rnd(8,22),c:pick(cols),w:Math.random()<0.5?3:2,h:Math.random()<0.5?2:4,heart:Math.random()<0.07});

function updateReveal(dt){
  G.t+=dt;const r=G.rev;
  for(const c of confetti){c.y+=c.vy*dt;c.ph+=dt*2.4;if(c.y>H+6){c.y=rnd(-30,-4);c.x=rnd(0,W);}}
  const nl=clamp(Math.floor((G.t-2.2)/0.24)+1,0,CFG.nome.length);
  if(nl>r.letters){SND.letter(r.letters);r.letters=nl;}
  const tt=clamp(Math.floor((G.t-4.6)/0.07),0,CFG.data.length);
  if(tt>r.typed){if(CFG.data[tt-1]!==' ')SND.type();r.typed=tt;}

function update(dt){
  G.gt+=dt;
  if(G.state==='title'){G.t+=dt;updateBg(dt,0);}
  else if(G.state==='play')updatePlay(dt);
  else if(G.state==='arrive')updateArrive(dt);
  else if(G.state==='suspense')updateSuspense(dt);
  else if(G.state==='reveal')updateReveal(dt);
  updateParts(dt);
}

const DAY={top:[70,176,255],bot:[200,240,255],dark:0},NIGHT={top:[52,40,140],bot:[122,92,206],dark:0.24};
const SKY=[
  Object.assign({p:0},DAY),Object.assign({p:40},DAY),
  {p:45,top:[150,128,240],bot:[255,196,110],dark:0.06},

  if(t>0.2&&out<0.5){
    const sp=CAFE.l2.lastIndexOf(' '),L2=V&&sp>0?[CAFE.l2.slice(0,sp),CAFE.l2.slice(sp+1)]:[CAFE.l2];   // de pé: a frase parte-se em duas linhas
    const bw=V?W-16:312,bh=36+L2.length*22,bx=(W-bw)/2,by=V?H-124-bh:88,tx=Math.round(W/2);
    ctx.fillStyle='#1b1f3a';ctx.fillRect(bx-2,by-2,bw+4,bh+4);ctx.fillRect(tx-10,by+bh,18,10);
    ctx.fillStyle='#fff';ctx.fillRect(bx,by,bw,bh);ctx.fillRect(tx-8,by+bh-1,14,7);ctx.fillRect(tx-5,by+bh+6,8,2);
    // chávena riscada + pergunta
    const cw=32+6+CAFE.l1.length*16,cx0=Math.round(W/2-cw/2);
    spr('cafe',cx0,by+1);
    ctx.fillStyle='#d81f2a';for(let i=0;i<26;i++)ctx.fillRect(cx0+3+i,by+29-i,3,2);
    txt(CAFE.l1,cx0+38,by+10,16,'#1b1f3a','left');
    for(let i=0;i<L2.length;i++)txt(L2[i],W/2,by+36+i*22,16,'#d81f2a','center');
  }
}
function drawPlay(){
  ctx.save();
  if(G.shake>0)ctx.translate(Math.round(rnd(-3,3)),Math.round(rnd(-3,3)));
  drawWorld(G.p);
  for(const o of G.obs){
    const m=META[o.k],f=m.frames>1?Math.floor(o.t*12)%m.frames:0;
    if(G.dark>0.09&&!o.spent){ctx.globalAlpha=Math.min(0.7,G.dark*3);const x=Math.round(o.x),y=Math.round(o.y);for(const d of [[-1,0],[1,0],[0,-1],[0,1]])ctx.drawImage(SIL[o.k],f*m.w,0,m.w,m.h,x+d[0],y+d[1],m.w,m.h);ctx.globalAlpha=1;}
    spr(o.k,o.x,o.y,f,1,o.spent?0.45:1);
  }
  for(const o of G.obs)drawTag(o);
  for(const c of G.picks){
    const bob=Math.sin(c.t*4+c.x*0.05)*2;spr(c.k,c.x-16,c.y-16+bob);
    if(c.k==='claude')txt('CLAUDE',c.x,c.y+15+bob,8,'#fff','center','#1b1f3a');
    else if(c.k==='cafe'){ctx.fillStyle='#1b2a5c';ctx.fillRect(Math.round(c.x-20),Math.round(c.y+13+bob),40,15);ctx.fillStyle='#fff6e0';ctx.fillRect(Math.round(c.x-19),Math.round(c.y+14+bob),38,13);txt('CAFÉ',c.x,c.y+19+bob,8,'#1b2a5c','center');}
  }
  if(G.shield>0&&(G.shield>1||Math.floor(G.gt*10)%2)){
    const cx=G.px+32,cy=G.py+36,r=31+Math.round(Math.sin(G.gt*8));
    pixCircle(cx,cy,r,'rgba(255,170,60,0.24)');
    for(let i=0;i<44;i++){const a=i/44*6.283+G.gt*2;ctx.fillStyle=i%2?'#ff9b3d':'#fff3b0';ctx.fillRect(Math.round(cx+Math.cos(a)*(r+2)),Math.round(cy+Math.sin(a)*(r+2)),2,2);}
    ctx.fillStyle='#1b1f3a';ctx.fillRect(G.px+11,G.py+72,42,5);ctx.fillStyle='#ff9b3d';ctx.fillRect(G.px+12,G.py+73,Math.round(40*G.shield/CLAUDE_DURA),3);
  }
  drawStork(G.px,G.py,G.invuln>0);
  drawParts();
  ctx.restore();
  if(G.flash>0){ctx.fillStyle='rgba(255,255,255,'+(G.flash*3).toFixed(2)+')';ctx.fillRect(0,0,W,H);}
  drawHUD();
  if(G.banner&&!G.popup){const a=clamp(Math.min(G.banner.t,2.3-G.banner.t)*4,0,1);const y=HUD_H+4;ctx.globalAlpha=a;ctx.fillStyle='rgba(47,168,158,0.85)';ctx.fillRect(0,y,W,20);ctx.fillStyle='#ffd45c';ctx.fillRect(0,y,W,2);ctx.fillRect(0,y+18,W,2);txt(G.banner.s,W/2,y+6,8,'#fff','center','#14524d');ctx.globalAlpha=1;}
  if(G.state==='play'&&!G.popup&&(!G.flapped||G.t<3.5)){ctx.globalAlpha=G.flapped?clamp(3.5-G.t,0,1):1;ctx.fillStyle='rgba(255,155,61,0.92)';
    if(V){const y=HUD_H+30;ctx.fillRect(10,y,W-20,88);ctx.fillStyle='#ffd45c';ctx.fillRect(10,y,W-20,2);ctx.fillRect(10,y+86,W-20,2);txt(T.h1V[0],W/2,y+9,16,'#fff','center','#8a3d00');txt(T.h1V[1],W/2,y+31,16,'#fff','center','#8a3d00');txt(T.h2V[0],W/2,y+57,8,'#fff6e0','center','#8a3d00');txt(T.h2V[1],W/2,y+70,8,'#fff6e0','center','#8a3d00');}
    else{ctx.fillRect(48,62,384,40);ctx.fillStyle='#ffd45c';ctx.fillRect(48,62,384,2);ctx.fillRect(48,100,384,2);txt(T.h1,W/2,68,16,'#fff','center','#8a3d00');txt(T.h2,W/2,90,8,'#fff6e0','center','#8a3d00');}
    ctx.globalAlpha=1;}
  if(G.state==='arrive'&&G.arr.stop){if(V){txtCores('ENTREGA',W/2,HUD_H+36,24,'center','#1b2a5c');txtCores('FEITA!',W/2,HUD_H+68,24,'center','#1b2a5c');}else txtCores('ENTREGA FEITA!',W/2,62,24,'center','#1b2a5c');}
  if(G.popup)drawPopup();
  if(G.paused){panel(0,0,W,H,0.55);const y=Math.round(H/2)-19;txt('PAUSA',W/2,y,24,'#fff','center','#000');txt(T.cont,W/2,y+34,8,'#fff','center');}
}
function drawTitleV(){
  const g0=G.gx;G.gx=118;drawWorld(0);G.gx=g0;   // de pé, a paisagem avança um pouco para o Cristo Rei caber
  const bob=Math.sin(G.gt*2.4)*5,g=clamp((H-190-232)/4,8,26);
  let y=clamp(Math.round((H-232-4*g)*0.25),12,44);
  txtCores('A CEGONHA',W/2,y,24,'center','#1b3a7a');txtCores('VEM AÍ!',W/2,y+34,24,'center','#1b3a7a');y+=58+g;
  txt('LEVA A ENCOMENDA',W/2,y,8,'#fff6c9','center','#1b3a7a');txt('ATÉ À ERA PORTUGAL',W/2,y+13,8,'#fff6c9','center','#1b3a7a');y+=21+g;
  const sx=W/2-32;
  spr('stork',sx,y-6+bob,Math.floor(G.gt*13));spr('paci_blue',sx-44,y+6-bob*0.6);spr('paci_pink',sx+76,y+6+bob*0.6);y+=56+g;
  panel(6,y,W-12,50,0.66);
  txt(T.t1,W/2,y+7,8,'#fff','center');
  txt('APANHA AS CHUPETAS E O CLAUDE',W/2,y+21,8,'#ffd166','center');
  txt('FOGE DOS PROBLEMAS DO DIA A DIA',W/2,y+35,8,'#ff9c9c','center');y+=50+g;
  if(Math.floor(G.gt*2)%2===0){txt(T.startV[0],W/2,y,16,'#fff','center','#1b1f3a');txt(T.startV[1],W/2,y+22,16,'#fff','center','#1b1f3a');}
}
function drawTitle(){
  if(V){drawTitleV();return;}
  drawWorld(0);
  const bob=Math.sin(G.gt*2.4)*5;
  spr('stork',128,92+bob,Math.floor(G.gt*13));
  spr('paci_blue',84,104-bob*0.6);spr('paci_pink',204,104+bob*0.6);
  txtCores(CFG.titulo,W/2,30,24,'center','#1b3a7a');
  txt('LEVA A ENCOMENDA ATÉ À ERA PORTUGAL',W/2,64,8,'#fff6c9','center','#1b3a7a');
  panel(84,168,312,50,0.66);
  txt(T.t1,W/2,175,8,'#fff','center');
  txt('APANHA AS CHUPETAS E O CLAUDE',W/2,189,8,'#ffd166','center');
  txt('FOGE DOS PROBLEMAS DO DIA A DIA',W/2,203,8,'#ff9c9c','center');
  if(Math.floor(G.gt*2)%2===0)txt(T.start,W/2,226,16,'#fff','center','#1b1f3a');
  if(MOBILE){

    if(rodado||fsm){ctx.fillStyle='#0b0f24';ctx.fillRect(FSB[0]-1,FSB[1]-1,FSB[2]+2,FSB[3]+2);ctx.fillStyle='#ffd166';ctx.fillRect(FSB[0],FSB[1],FSB[2],FSB[3]);txt(fsm?'TOCA AQUI: ECRÃ INTEIRO':'JOGA COM O TELEMÓVEL DEITADO',W/2,FSB[1]+4,8,'#1b1f3a','center');}
  }else{
    const fs=!!document.fullscreenElement;
    ctx.fillStyle='#0b0f24';ctx.fillRect(FSB[0]-1,FSB[1]-1,FSB[2]+2,FSB[3]+2);
    ctx.fillStyle=fs?'#2c3358':'#ffd166';ctx.fillRect(FSB[0],FSB[1],FSB[2],FSB[3]);
    txt(fs?'F: SAIR DO ECRÃ INTEIRO':'F OU CLIQUE: ECRÃ INTEIRO',W/2,FSB[1]+4,8,fs?'#fff':'#1b1f3a','center');
    panel(2,2,192,11,0.6);txtS('M: SOM   P: PAUSA   R: RECOMEÇAR',5,5,'#fff');
  }
}
function drawSuspense(){
  const s=G.sus,cy=V?Math.round(H*0.44):128,by=cy-66;
  if(!s.drum){
    // fundo amarelo, como a Raquel pediu, do princípio ao fim do suspense
    ctx.fillStyle='#ffd45c';ctx.fillRect(0,0,W,H);
    for(let i=0;i<12;i++){const a=i*Math.PI/6+G.gt*0.25,R=V?720:420;ctx.fillStyle=i%2?'#ffdc70':'#ffcb45';ctx.beginPath();ctx.moveTo(W/2,cy);ctx.lineTo(W/2+Math.cos(a)*R,cy+Math.sin(a)*R);ctx.lineTo(W/2+Math.cos(a+0.26)*R,cy+Math.sin(a+0.26)*R);ctx.fill();}
    pixCircle(W/2,cy,104,'#ffe07a');pixCircle(W/2,cy,82,'#ffe996');pixCircle(W/2,cy,58,'#fff3bd');
    if(V){txt('MENINO OU',W/2,by-84,24,'#1b2a5c','center','#fff');txt('MENINA?',W/2,by-52,24,'#1b2a5c','center','#fff');}
    else txt('MENINO OU MENINA?',W/2,20,24,'#1b2a5c','center','#fff');
    spr('bundle',W/2-64+Math.sin(G.t*7)*1.5,by+Math.abs(Math.sin(G.t*3.5))*-3,0,2);
    if(V){
      spr('paci_blue',26,cy+62,0,2);txt('x'+G.blue,58,cy+130,16,'#1f6fc0','center','#fff');
      spr('paci_pink',W-90,cy+62,0,2);txt('x'+G.pink,W-58,cy+130,16,'#d02a78','center','#fff');
      if(G.t>1.0&&Math.floor(G.gt*2)%2===0){txt(T.openV[0],W/2,cy+158,16,'#e0520a','center','#fff');txt(T.openV[1],W/2,cy+180,16,'#e0520a','center','#fff');}
    }else{
      spr('paci_blue',58,104,0,2);txt('x'+G.blue,90,172,16,'#1f6fc0','center','#fff');
      spr('paci_pink',W-122,104,0,2);txt('x'+G.pink,W-90,172,16,'#d02a78','center','#fff');
      if(G.t>1.0&&Math.floor(G.gt*2)%2===0)txt(T.open,W/2,218,16,'#e0520a','center','#fff');
    }
    const a=clamp(1-G.t/0.6,0,1);if(a>0){ctx.fillStyle='rgba(11,15,30,'+a+')';ctx.fillRect(0,0,W,H);}
  }else{
    const k=clamp(s.dt/3.4,0,1);
    const m=0.5+0.5*Math.sin(s.phi||0);
    const c=mixc([255,206,84],[255,232,150],m);
    ctx.fillStyle=rgb(c);ctx.fillRect(0,0,W,H);
    pixCircle(W/2,cy,96,rgb(mixc(c,[255,255,255],0.18)));pixCircle(W/2,cy,66,rgb(mixc(c,[255,255,255],0.36)));
    const sh=1+k*4;
    spr('bundle',W/2-64+rnd(-sh,sh),by+rnd(-sh,sh),0,2);
    txt('É'+'...'.slice(0,1+Math.floor(s.dt*1.5)%3),W/2,V?by-66:20,32,'#1b1f3a','center','#fff');
    txt('MENINO',70,V?cy+96:208,16,'#1f6fc0','center','#fff');txt('MENINA',W-70,V?cy+96:208,16,'#d02a78','center','#fff');
  }
}
function drawReveal(){
  const t=G.t,bands=15,bh=H/bands;
  for(let i=0;i<bands;i++){ctx.fillStyle=rgb(mixc([255,122,178],[255,206,228],i/(bands-1)));ctx.fillRect(0,Math.round(i*bh),W,Math.ceil(bh));}
  // de pé: tudo um pouco mais estreito, com a data em duas linhas
  const y0=V?Math.round((H-300)*0.48):14,hs=V?24:32,cs=V?40:48,yb=y0+(V?44:28),yn=yb+(V?150:142),yd=yn+(V?62:61);
  const cx=W/2,cy=yb+68;
  pixCircle(cx,cy,92+Math.round(Math.sin(t*2)*3),'rgba(255,255,255,0.16)');pixCircle(cx,cy,68,'rgba(255,255,255,0.20)');
  for(const c of confetti){
    const x=c.x+Math.sin(c.ph)*c.sw;
    if(c.heart)spr('heart',x-16,c.y-16);else{ctx.fillStyle=c.c;ctx.fillRect(Math.round(x),Math.round(c.y),c.w,c.h);}
  }
  const pop=t<0.35?-Math.sin(t/0.35*3.14)*8:0;
  txt(CFG.revelacao,W/2,y0+pop,hs,'#fff','center','#c2206c');
  spr('baby',W/2-64,yb+Math.sin(t*2.2)*2,0,2);
  const n=CFG.nome,x0=W/2-n.length*cs/2;
  for(let i=0;i<G.rev.letters;i++){
    const lt=t-2.2-i*0.24,dy=lt<0.3?-(1-lt/0.3)*(1-lt/0.3)*40:Math.sin(t*3+i*0.7)*1.5;
    txt(n[i],x0+i*cs,yn+dy,cs,'#fff','left','#b0245f');
  }
  const D=CFG.data,q=V?D.lastIndexOf(' DE '):-1,ty=G.rev.typed;
  if(ty>0){
    if(q>0){txt(D.slice(0,Math.min(ty,q)),W/2-q*8,yd,16,'#fff','left','#8a1a4d');if(ty>q+1)txt(D.slice(q+1,ty),W/2-(D.length-q-1)*8,yd+24,16,'#fff','left','#8a1a4d');}
    else txt(D.slice(0,ty),W/2-D.length*8,yd,16,'#fff','left','#8a1a4d');
  }
  if(t>(MOBILE?8:14))txt(T.again,W-4,3,8,'rgba(255,255,255,0.85)','right');
  if(t<0.7){ctx.fillStyle='rgba(255,255,255,'+clamp(1-t/0.7,0,1).toFixed(2)+')';ctx.fillRect(0,0,W,H);}
}
function draw(){
  if(G.state==='title')drawTitle();
  else if(G.state==='play'||G.state==='arrive'){drawPlay();if(G.state==='arrive'&&G.arr.stop&&G.arr.done>2.1){ctx.fillStyle='rgba(11,15,30,'+clamp((G.arr.done-2.1)/0.7,0,1).toFixed(2)+')';ctx.fillRect(0,0,W,H);}}
  else if(G.state==='suspense')drawSuspense();
  else if(G.state==='reveal')drawReveal();
  if(G.state==='title'||G.state==='suspense')drawParts();
}

/* ---------- ciclo ---------- */
const STEP=1/120;let last=0,acc=0;
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  acc+=dt*(window.__speed||1);let n=0;
  while(acc>=STEP&&n<2400){update(STEP);acc-=STEP;n++;}
  draw();cv.style.cursor=(MOBILE||G.state==='title')?'pointer':'none';requestAnimationFrame(frame);
}
Promise.all([loadAll(),(document.fonts&&document.fonts.load?document.fonts.load('8px "PS2P"').catch(()=>{}):Promise.resolve())]).then(()=>{
  buildLayer('bg_hills');['crow','storm','angry','rain'].forEach(buildSil);
  document.getElementById('pre').remove();
  toTitle();cv.focus();requestAnimationFrame(frame);
}).catch(e=>{document.getElementById('pre').textContent='Erro a carregar: '+e.message;});
})();
</script>
